    <h1>隐私政策</h1>

    <p>欢迎使用“BoraFalar葡语通”（以下简称“本App”）。我们尊重并保护每一位用户的隐私。</p>

    <h2>1. 我们收集的信息</h2>

    <p><strong>1.1 账户信息</strong><br>
    注册时收集用户名和密码，用于登录。</p>

    <p><strong>1.2 头像信息</strong><br>
    您上传的头像将存储在本地上，用于个人资料显示。</p>

    <p><strong>1.3 语音数据</strong><br>
    语音仅用于发音练习，不用于其他用途。</p>

    <h2>2. 信息存储</h2>

    <ul>
        <li>数据存储在安全服务器中</li>
        <li>不与第三方共享</li>
    </ul>

    <h2>3. 联系方式</h2>

    <p>如果您有任何问题，请通过应用内的反馈功能联系我们。</p>
